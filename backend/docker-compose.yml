# Base local del backend: PostgreSQL 16 con el esquema de db/db_ddl.sql.
# El DDL corre solo cuando el volumen es nuevo. Para empezar de cero: docker compose down -v
services:
  db:
    image: postgres:16
    container_name: relia-db
    environment:
      POSTGRES_DB: relia
      POSTGRES_USER: relia
      POSTGRES_PASSWORD: relia
    ports:
      # 5433 en el host para no chocar con un Postgres local en 5432.
      - "${RELIA_DB_PORT:-5433}:5432"
    volumes:
      - relia-db-data:/var/lib/postgresql/data
      - ./db/db_ddl.sql:/docker-entrypoint-initdb.d/01_db_ddl.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relia -d relia"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  relia-db-data:
