<main>
  <form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1 class="wordmark" aria-label="relia">relia<span aria-hidden="true">.</span></h1>
    <p class="subtitle">Tu caja de efectivo y dinero digital.</p>

    <div class="field">
      <label for="email">Correo</label>
      <input
        pInputText
        id="email"
        type="email"
        formControlName="email"
        autocomplete="username"
        [attr.aria-invalid]="error() ? true : null"
        [attr.aria-describedby]="error() ? 'login-error' : null"
      />
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input
        pInputText
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="error() ? true : null"
        [attr.aria-describedby]="error() ? 'login-error' : null"
      />
    </div>

    @if (error(); as message) {
      <p id="login-error" class="error" role="alert">{{ message }}</p>
    }

    <button class="btn-primary" type="submit" [disabled]="form.invalid || loading()">Entrar</button>

    <ul class="help">
      <li>Corresponsal: rosa&#64;demo.relia / demo1234</li>
      <li>Admin Relia: admin&#64;relia.co / admin1234</li>
    </ul>

    <a class="link" routerLink="/vincular">¿Eres usuario? Vincula tu celular</a>
  </form>
</main>
