<header class="bar">
  <a class="brand" routerLink="/caja">
    <span class="wordmark">relia<span aria-hidden="true">.</span></span>
    <span class="store">{{ store() }}</span>
  </a>

  <button
    type="button"
    class="menu-button"
    aria-label="Abrir menú"
    aria-haspopup="menu"
    [attr.aria-expanded]="menuOpen()"
    (click)="menu.toggle($event)"
  >
    <i class="pi pi-bars" aria-hidden="true"></i>
  </button>

  <p-menu
    #menu
    [model]="items"
    [popup]="true"
    appendTo="body"
    ariaLabel="Menú del corresponsal"
    (onShow)="menuOpen.set(true)"
    (onHide)="menuOpen.set(false)"
  >
    <ng-template #start>
      @if (user(); as u) {
        <div class="menu-user">
          <strong>{{ u.name }}</strong>
          <span>{{ u.email }}</span>
        </div>
      }
    </ng-template>
  </p-menu>
</header>

<router-outlet />
