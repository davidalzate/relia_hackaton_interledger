<header class="bar">
  <a class="brand" routerLink="/caja">
    <span class="wordmark">relia<span aria-hidden="true">.</span></span>
    <span class="store">{{ store() }}</span>
  </a>

  <button
    type="button"
    class="menu-button"
    aria-label="Abrir menú"
    aria-haspopup="menu"
    [attr.aria-expanded]="menuOpen()"
    (click)="menu.toggle($event)"
  >
    <i class="pi pi-bars" aria-hidden="true"></i>
  </button>

  <p-menu
    #menu
    [model]="items"
    [popup]="true"
    appendTo="body"
    ariaLabel="Menú del corresponsal"
    (onShow)="menuOpen.set(true)"
    (onHide)="menuOpen.set(false)"
  >
    <ng-template #start>
      @if (user(); as u) {
        <div class="menu-user">
          <strong>{{ u.name }}</strong>
          <span>{{ u.email }}</span>
        </div>
      }
    </ng-template>
  </p-menu>
</header>

<router-outlet />

<app-demo-panel />

<!-- B4: modal de confirmación de efectivo; las vistas hijas lo abren con
     ConfirmationService.confirm({ message, accept }) -->
<p-confirmdialog
  #confirm
  header="Confirma el efectivo"
  styleClass="cash-confirm"
  maskStyleClass="modal-mask"
  [closable]="false"
  [style]="{ width: 'min(420px, calc(100vw - 32px))' }"
>
  <ng-template #footer>
    <div class="confirm-actions">
      <button type="button" class="btn-primary" (click)="confirm.onAccept()">Sí, confirmo</button>
      <!-- Cierra sin hacer nada -->
      <button type="button" class="btn-secondary" (click)="confirm.onReject()">No, revisar</button>
    </div>
  </ng-template>
</p-confirmdialog>
